<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caso 2 - Cajero bancario</title>
  <style>
    body{font-family:Arial;background:#f2f4f8;padding:25px;color:#222}main{max-width:750px;margin:auto;background:white;padding:25px;border-radius:12px}
    h1{color:#17324d}input,select,button{padding:11px;margin:5px;border:1px solid #bbb;border-radius:6px;font-size:15px}
    button{background:#17324d;color:white;border:0;cursor:pointer}#resultado{background:#eef4f8;padding:15px;margin-top:18px;border-radius:8px}
  </style>
</head>
<body>
<main>
  <h1>Cajero bancario inteligente</h1>
  <p>Saldo inicial: <strong>$0.00</strong></p>
  <input type="number" id="monto" min="0.01" step="0.01" placeholder="Ingrese el monto">
  <select id="operacion">
    <option value="deposito">Depósito</option>
    <option value="retiro">Retiro</option>
  </select>
  <button id="btnRegistrar">Registrar movimiento</button>
  <h2>Movimientos realizados</h2>
  <ul id="lista"></ul>
  <button id="btnResumen">Ver resumen</button>
  <div id="resultado">Aqui apareceran los totales y el saldo.</div>
</main>
<script src="app.js"></script>
</body>
</html>
