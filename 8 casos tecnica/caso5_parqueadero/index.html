<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caso 5 - Parqueadero</title>
  <style>
    body{font-family:Arial;background:#f2f4f8;padding:25px;color:#222}main{max-width:750px;margin:auto;background:white;padding:25px;border-radius:12px}
    h1{color:#17324d}.fila{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}input,button{padding:11px;border:1px solid #bbb;border-radius:6px;font-size:15px}
    input{flex:1;min-width:130px}button{background:#17324d;color:white;border:0;cursor:pointer}.caja{background:#eef4f8;padding:15px;margin-top:15px;border-radius:8px}
  </style>
</head>
<body>
<main>
  <h1>Control de parqueadero</h1>
  <h2>Registrar entrada</h2>
  <div class="fila">
    <input type="text" id="placaEntrada" placeholder="Placa del vehiculo">
    <input type="number" id="horaEntrada" min="0" max="23" placeholder="Hora de entrada (0-23)">
    <button id="btnEntrada">Registrar entrada</button>
  </div>
  <h2>Registrar salida</h2>
  <div class="fila">
    <input type="text" id="placaSalida" placeholder="Placa del vehiculo">
    <input type="number" id="horaSalida" min="0" max="23" placeholder="Hora de salida (0-23)">
    <button id="btnSalida">Registrar salida</button>
  </div>
  <h2>Vehiculos estacionados</h2>
  <ul id="lista"></ul>
  <div class="caja" id="resultado">Total cobrado hoy: $0.00</div>
</main>
<script src="app.js"></script>
</body>
</html>
