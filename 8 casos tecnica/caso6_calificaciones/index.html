<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caso 6 - Calificaciones</title>
  <style>
    body{font-family:Arial;background:#f2f4f8;padding:25px;color:#222}main{max-width:750px;margin:auto;background:white;padding:25px;border-radius:12px}
    h1{color:#17324d}.fila{display:flex;gap:8px;flex-wrap:wrap}input,button{padding:11px;border:1px solid #bbb;border-radius:6px;font-size:15px}
    input{flex:1;min-width:140px}button{background:#17324d;color:white;border:0;cursor:pointer;margin-top:8px}.caja{background:#eef4f8;padding:15px;margin-top:15px;border-radius:8px}
  </style>
</head>
<body>
<main>
  <h1>Registro de calificaciones</h1>
  <div class="fila">
    <input type="text" id="nombre" placeholder="Nombre del estudiante">
    <input type="number" id="nota" min="0" max="10" step="0.01" placeholder="Nota (0 a 10)">
    <button id="btnAgregar">Agregar estudiante</button>
  </div>
  <h2>Estudiantes registrados</h2>
  <ul id="lista"></ul>
  <button id="btnCalcular">Calcular estadísticas</button>
  <div class="caja" id="resultado">Aquí aparecerán las estadísticas.</div>
</main>
<script src="app.js"></script>
</body>
</html>
