<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caso 7 - Libreria estudiantil</title>
  <style>
    body{font-family:Arial;background:#f2f4f8;padding:25px;color:#222}main{max-width:800px;margin:auto;background:white;padding:25px;border-radius:12px}
    h1{color:#17324d}.fila{display:flex;gap:8px;flex-wrap:wrap}input,button{padding:11px;border:1px solid #bbb;border-radius:6px;font-size:15px}
    input{flex:1;min-width:140px}button{background:#17324d;color:white;border:0;cursor:pointer;margin-top:8px}.caja{background:#eef4f8;padding:15px;margin-top:15px;border-radius:8px}
  </style>
</head>
<body>
<main>
  <h1>Facturacion - Libreria Academica</h1>
  <div class="fila">
    <input type="text" id="producto" placeholder="Nombre del producto">
    <input type="number" id="precio" min="0.01" step="0.01" placeholder="Precio unitario">
    <button id="btnAgregar">Agregar producto</button>
  </div>
  <h2>Productos registrados</h2>
  <ul id="lista"></ul>
  <button id="btnFactura">Generar factura</button>
  <div class="caja" id="resultado">Aqui aparecera la factura.</div>
</main>
<script src="app.js"></script>
</body>
</html>
